<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" role="img" aria-label="Terminal glitch name" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style type="text/css"><![CDATA[
      .bg { fill: #000; }
      .term { fill: #00ff6a; font: 700 64px/1 'SFMono-Regular', Menlo, Monaco, Consolas, 'Courier New', monospace; letter-spacing: 2px; }
      .glitchR { fill: #ff3b3b; opacity: 0.85 }
      .glitchB { fill: #33d4ff; opacity: 0.85 }
      .scan { fill: rgba(255,255,255,0.02) }
      .noise { mix-blend-mode:screen; opacity:0.06 }
    ]]></style>

    <filter id="fblur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" />
    </filter>

    <clipPath id="slice">
      <rect x="0" y="10" width="1200" height="20">
        <animate attributeName="x" dur="3s" values="0; -10; 0; 6; 0" repeatCount="indefinite" />
      </rect>
      <rect x="0" y="40" width="1200" height="12">
        <animate attributeName="x" dur="2.6s" values="0; 8; 0; -6; 0" repeatCount="indefinite" />
      </rect>
      <rect x="0" y="66" width="1200" height="10">
        <animate attributeName="x" dur="1.9s" values="0; -6; 0; 4; 0" repeatCount="indefinite" />
      </rect>
      <rect x="0" y="90" width="1200" height="18">
        <animate attributeName="x" dur="2.3s" values="0; 6; 0; -8; 0" repeatCount="indefinite" />
      </rect>
      <rect x="0" y="120" width="1200" height="10">
        <animate attributeName="x" dur="2.1s" values="0; -4; 0; 6; 0" repeatCount="indefinite" />
      </rect>
    </clipPath>

    <linearGradient id="grad-term" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff6a" />
      <stop offset="60%" stop-color="#84ffb2" />
      <stop offset="100%" stop-color="#b7ffd9" />
    </linearGradient>

    <filter id="neon-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="rgba(255,255,255,0.02)" />
    </pattern>

    <filter id="grain">
      <feTurbulence baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="t" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.12" />
      </feComponentTransfer>
    </filter>
  </defs>

  <rect class="bg" width="100%" height="100%" />

  <!-- scanline overlay -->
  <rect width="100%" height="100%" fill="url(#scanlines)" opacity="0.6" />

  <!-- noise overlay -->
  <rect class="noise" width="100%" height="100%" filter="url(#grain)" />

  <g transform="translate(0,110)">
    <!-- Base terminal text centered -->
    <text x="50%" y="0" class="term" text-anchor="middle" dominant-baseline="middle">Srikar Sriramoju</text>

    <!-- red glitch layer -->
    <g clip-path="url(#slice)">
      <text x="50%" y="0" class="term glitchR" text-anchor="middle" dominant-baseline="middle" opacity="0.95">
        <animateTransform attributeName="transform" type="translate" dur="0.8s" values="-2 0; 6 0; -4 0; 0 0" repeatCount="indefinite" />
        Srikar Sriramoju
      </text>
    </g>

    <!-- blue glitch layer -->
    <g clip-path="url(#slice)">
      <text x="50%" y="0" class="term glitchB" text-anchor="middle" dominant-baseline="middle" opacity="0.85">
        <animateTransform attributeName="transform" type="translate" dur="1.2s" values="4 0; -6 0; 2 0; 0 0" repeatCount="indefinite" />
        Srikar Sriramoju
      </text>
    </g>

    <!-- brief flash slice -->
    <rect x="0" y="-40" width="1200" height="10" fill="#000">
      <animate attributeName="opacity" values="0;0.9;0" dur="6s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- translucent overlay to simulate CRT flicker -->
  <rect width="100%" height="100%" fill="#000" opacity="0.02">
    <animate attributeName="opacity" values="0.02;0.06;0.02" dur="3.2s" repeatCount="indefinite" />
  </rect>

  <!-- Blinking cursor to the right of the name (approximate) -->
  <rect x="760" y="72" width="10" height="56" fill="#00ff6a" opacity="1">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
    <animate attributeName="x" values="760;764;756;760" dur="0.9s" repeatCount="indefinite" />
  </rect>

</svg>
