<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-label="Animated terminal skills console">
  <defs>
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070812" />
      <stop offset="100%" stop-color="#0c1020" />
    </linearGradient>

    <linearGradient id="bar-grad-a" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5b21b6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="bar-grad-b" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .console-bg {
      fill: url(#term-bg);
      stroke: #2a2245;
      stroke-width: 2px;
      rx: 12px;
    }

    .header-bar {
      fill: #111022;
      stroke: #2a2245;
      stroke-width: 1px;
    }

    .term {
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      fill: #d3d1e8;
    }

    .dim { fill: #8f88b0; }
    .user { fill: #38bdf8; font-weight: 700; }
    .host { fill: #8b5cf6; }
    .cmd { fill: #c084fc; font-weight: 700; }
    .info { fill: #8be9fd; }
    .ok { fill: #34d399; }
    .warn { fill: #fbbf24; }
    .section { fill: #c084fc; font-weight: 700; }
    .skill { fill: #dddaf0; }
    .track { fill: #171429; }
    .bar-a { filter: url(#glow); }
    .bar-b { filter: url(#glow); }
    .cursor { fill: #38bdf8; }

    /* Cursor Blink effect running independently */
    .blink { animation: blink 1s step-end infinite; }
    @keyframes blink {
      from, to { opacity: 0; }
      50% { opacity: 1; }
    }

    /* * MASTER TIMELINE CONTROLS (30 Second Loop)
     * 15s Delay happens between 33.3% (10s) and 83.3% (25s)
     */
    
    .type-cmd-1 { animation: type1 30s infinite steps(25, end); }
    .type-cmd-2 { animation: type2 30s infinite steps(15, end); }
    
    .cursor-1-anim { animation: c1 30s infinite steps(25, end); }
    .cursor-2-anim { animation: c2 30s infinite steps(15, end); }

    .fade-15 { animation: f15 30s infinite; opacity: 0; }
    .fade-16 { animation: f16 30s infinite; opacity: 0; }
    .fade-17 { animation: f17 30s infinite; opacity: 0; }
    .fade-18 { animation: f18 30s infinite; opacity: 0; }
    .fade-20 { animation: f20 30s infinite; opacity: 0; }
    .fade-23 { animation: f23 30s infinite; opacity: 0; }
    .fade-26 { animation: f26 30s infinite; opacity: 0; }
    .fade-30 { animation: f30 30s infinite; opacity: 0; }
    .fade-83 { animation: f83 30s infinite; opacity: 0; }

    .bar-1-anim { animation: b1 30s infinite ease-out; width: 0; }
    .bar-2-anim { animation: b2 30s infinite ease-out; width: 0; }
    .bar-3-anim { animation: b3 30s infinite ease-out; width: 0; }
    .bar-4-anim { animation: b4 30s infinite ease-out; width: 0; }

    /* Typing command 1 (1s to 4s) */
    @keyframes type1 {
      0%, 3.3% { clip-path: inset(0 100% -10% 0); }
      13.3%, 99.9% { clip-path: inset(0 0% -10% 0); }
      100% { clip-path: inset(0 100% -10% 0); }
    }
    
    /* Cursor 1 movement */
    @keyframes c1 {
      0%, 3.3% { transform: translateX(0); opacity: 1; }
      13.3% { transform: translateX(210px); opacity: 1; }
      13.4%, 100% { transform: translateX(210px); opacity: 0; }
    }

    /* Standard output fade-ins (4.5s to 9s) */
    @keyframes f15 { 0%, 14.9% { opacity: 0; } 15%, 99.9% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes f16 { 0%, 15.9% { opacity: 0; } 16%, 99.9% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes f17 { 0%, 16.9% { opacity: 0; } 17%, 99.9% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes f18 { 0%, 18.2% { opacity: 0; } 18.3%, 99.9% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes f20 { 0%, 19.9% { opacity: 0; } 20%, 99.9% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes f23 { 0%, 23.2% { opacity: 0; } 23.3%, 99.9% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes f26 { 0%, 26.5% { opacity: 0; } 26.6%, 99.9% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes f30 { 0%, 29.9% { opacity: 0; } 30%, 99.9% { opacity: 1; } 100% { opacity: 0; } }
    
    /* Second prompt appearance at 25s (After 15s delay) */
    @keyframes f83 { 0%, 83.2% { opacity: 0; } 83.3%, 99.9% { opacity: 1; } 100% { opacity: 0; } }

    /* Skill bars loading sequentially */
    @keyframes b1 { 0%, 20% { width: 0; } 23.3%, 99.9% { width: 196px; } 100% { width: 0; } }
    @keyframes b2 { 0%, 23.3% { width: 0; } 26.6%, 99.9% { width: 186px; } 100% { width: 0; } }
    @keyframes b3 { 0%, 26.6% { width: 0; } 30%, 99.9% { width: 198px; } 100% { width: 0; } }
    @keyframes b4 { 0%, 30% { width: 0; } 33.3%, 99.9% { width: 210px; } 100% { width: 0; } }

    /* Typing command 2 (25.5s to 27.5s) */
    @keyframes type2 {
      0%, 85% { clip-path: inset(0 100% -10% 0); }
      91.6%, 99.9% { clip-path: inset(0 0% -10% 0); }
      100% { clip-path: inset(0 100% -10% 0); }
    }
    
    /* Cursor 2 movement */
    @keyframes c2 {
      0%, 83.2% { opacity: 0; transform: translateX(0); }
      83.3%, 85% { opacity: 1; transform: translateX(0); }
      91.6% { transform: translateX(126px); opacity: 1; }
      92.5%, 100% { opacity: 0; transform: translateX(126px); }
    }
  </style>

  <rect width="800" height="380" class="console-bg" />
  <path d="M 0,12 A 12,12 0 0,1 12,0 L 788,0 A 12,12 0 0,1 800,12 L 800,36 L 0,36 Z" class="header-bar" />

  <circle cx="20" cy="17" r="6" fill="#ff5f56" />
  <circle cx="40" cy="17" r="6" fill="#ffbd2e" />
  <circle cx="60" cy="17" r="6" fill="#27c93f" />
  <text x="400" y="22" class="term" text-anchor="middle" font-size="12" fill="#7d77a2">srika@space-networks: ~/skills</text>

  <g transform="translate(24, 65)">
    <text x="0" y="0" class="term">
      <tspan class="user">srika</tspan><tspan class="dim">@</tspan><tspan class="host">space-networks</tspan><tspan class="dim">:~$ </tspan>
    </text>
    
    <g class="type-cmd-1">
      <text x="210" y="0" class="term cmd">npx load-skills --verbose</text>
    </g>

    <g class="cursor-1-anim">
      <rect x="210" y="-12" width="8" height="15" class="cursor blink" />
    </g>

    <text x="0" y="32" class="term info fade-15">[INFO] typing skill manifest...</text>
    <text x="0" y="58" class="term ok fade-16">[OK] parsing system modules and runtime context...</text>
    <text x="0" y="84" class="term warn fade-17">[LOAD] response bars are filling...</text>

    <g class="fade-18">
      <text x="0" y="110" class="term dim">==============================================================</text>
      <text x="0" y="136" class="term section">core skills // typing mode</text>
    </g>

    <g class="fade-20">
      <text x="22" y="162" class="term skill">Java • JavaScript • Python • SQL • C</text>
      <rect x="492" y="152" width="224" height="10" rx="5" class="track" />
      <rect x="492" y="152" height="10" rx="5" fill="url(#bar-grad-a)" class="bar-a bar-1-anim" />
    </g>

    <g class="fade-23">
      <text x="22" y="190" class="term skill">Three.js • React.js • Tailwind CSS</text>
      <rect x="492" y="180" width="224" height="10" rx="5" class="track" />
      <rect x="492" y="180" height="10" rx="5" fill="url(#bar-grad-b)" class="bar-b bar-2-anim" />
    </g>

    <g class="fade-26">
      <text x="22" y="218" class="term skill">Node.js • Express.js • Spring Boot • WebRTC • Socket.IO</text>
      <rect x="492" y="208" width="224" height="10" rx="5" class="track" />
      <rect x="492" y="208" height="10" rx="5" fill="url(#bar-grad-a)" class="bar-a bar-3-anim" />
    </g>

    <g class="fade-30">
      <text x="22" y="246" class="term skill">Raspberry Pi • Tailscale VPN • Linux • Zero-Trust</text>
      <rect x="492" y="236" width="224" height="10" rx="5" class="track" />
      <rect x="492" y="236" height="10" rx="5" fill="url(#bar-grad-b)" class="bar-b bar-4-anim" />
    </g>

    <g class="fade-83">
      <text x="0" y="286" class="term">
        <tspan class="user">srika</tspan><tspan class="dim">@</tspan><tspan class="host">space-networks</tspan><tspan class="dim">:~$ </tspan>
      </text>
      <g class="type-cmd-2">
        <text x="210" y="286" class="term cmd">skills --repeat</text>
      </g>
      <g class="cursor-2-anim">
        <rect x="210" y="274" width="8" height="15" class="cursor blink" />
      </g>
    </g>
  </g>
</svg>
